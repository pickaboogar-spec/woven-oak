<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101018">
<title>Woven Oak — a free electronic acapella instrument</title>
<style>
  :root{
    --bg:#101018; --panel:#1a1a26; --ink:#f2f2f7; --dim:#a7a7b8;
    --pad-gap:12px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column;
    height:100dvh; overflow:hidden;
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  header{
    padding:calc(10px + env(safe-area-inset-top)) 16px 6px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  header h1{ margin:0; font-size:22px; letter-spacing:.4px; }
  header h1 .beta{
    font-size:11px; color:var(--dim); border:1px solid var(--dim);
    border-radius:999px; padding:2px 8px; vertical-align:middle; margin-left:6px;
    white-space:nowrap;
  }
  header p{ margin:0; font-size:12px; color:var(--dim); text-align:right; }
  #msg{
    margin:6px 16px 0; min-height:20px; font-size:14px; line-height:1.35;
    color:#ffd479;
  }
  #msg:empty{ display:none; }
  main{
    flex:1; display:grid; gap:var(--pad-gap);
    grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,1fr);
    padding:12px 16px;
    min-height:0;
  }
  .pad{
    --hue:210;
    position:relative; border:0; border-radius:22px; cursor:pointer;
    background:hsl(var(--hue) 45% 26%);
    color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    font:inherit; padding:10px;
    transition:background .15s ease, transform .05s ease;
  }
  .pad:active{ transform:scale(.985); }
  .pad .num{
    position:absolute; top:10px; left:14px; font-size:13px; font-weight:700;
    color:hsl(var(--hue) 90% 82%); opacity:.9;
  }
  .pad .state{ font-size:19px; font-weight:700; letter-spacing:.3px; text-align:center; }
  .pad .sub{ font-size:13px; color:var(--ink); opacity:.75; text-align:center; min-height:16px; }
  .pad.empty{ background:hsl(var(--hue) 30% 20%); }
  .pad.empty .state{ color:hsl(var(--hue) 85% 85%); }
  .pad.recording{
    background:hsl(0 65% 32%);
    animation:recpulse 1s ease-in-out infinite;
  }
  .pad.playing{
    background:hsl(var(--hue) 60% 34%);
    animation:playpulse var(--loopdur,1s) ease-in-out infinite;
  }
  .pad.ready{ background:hsl(var(--hue) 50% 28%); }
  @keyframes recpulse{
    0%,100%{ box-shadow:0 0 0 0 hsla(0 90% 60% / .0) inset, 0 0 0 0 hsla(0 90% 60% / .55); }
    50%{ box-shadow:0 0 0 0 hsla(0 90% 60% / .0) inset, 0 0 34px 6px hsla(0 90% 60% / .55); }
  }
  @keyframes playpulse{
    0%,100%{ box-shadow:0 0 0 0 hsl(var(--hue) 95% 70% / 0); }
    50%{ box-shadow:0 0 38px 8px hsl(var(--hue) 95% 70% / .65); }
  }
  @media (prefers-reduced-motion: reduce){
    .pad.recording,.pad.playing{ animation:none; }
    .pad.playing{ outline:3px solid hsl(var(--hue) 95% 75%); }
    .pad.recording{ outline:3px solid hsl(0 90% 65%); }
  }
  footer{
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:8px; background:var(--panel);
  }
  #stopAll{
    font:inherit; font-size:17px; font-weight:700; letter-spacing:.3px;
    background:#2c2c3e; color:var(--ink); border:1px solid #45455e;
    border-radius:14px; padding:14px; cursor:pointer; width:100%;
  }
  #stopAll:active{ background:#3a3a52; }
  footer .hint{
    margin:0; font-size:12.5px; color:var(--dim); text-align:center; line-height:1.45;
  }
</style>
</head>
<body>
<header>
  <h1>Woven Oak<span class="beta">0.1.0-beta.1</span></h1>
  <p>free forever · your voice,<br>looped · nothing leaves<br>this phone</p>
</header>

<div id="msg" role="status" aria-live="polite"></div>

<main id="board" aria-label="Loop pads"></main>

<footer>
  <button id="stopAll" type="button">■ Stop all</button>
  <p class="hint">Tap a pad to record · tap again to loop it · tap a playing pad to stop it · hold a pad to clear it</p>
</footer>

<script>
"use strict";
/* Woven Oak 0.1.0-beta.1 — six-pad looping instrument.
   Capture: getUserMedia -> MediaRecorder -> decodeAudioData -> AudioBuffer.
   Playback: AudioBufferSourceNode with loop=true (sample-accurate,
   gapless loop restart, no per-loop JS scheduling latency). */

const HUES = [8, 38, 95, 160, 205, 275];
const LONG_PRESS_MS = 600;

const board = document.getElementById("board");
const msgEl = document.getElementById("msg");
const stopAllBtn = document.getElementById("stopAll");

let audioCtx = null;      // created/resumed on first gesture
let micStream = null;     // acquired lazily on first record
let micReady = false;
let micDenied = false;

function showMsg(text){ msgEl.textContent = text || ""; }

function ensureCtx(){
  if (!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

async function ensureMic(){
  if (micReady) return true;
  if (micDenied) return false;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    micReady = true;
    return true;
  } catch (err) {
    micDenied = true;
    showMsg("Woven Oak needs the microphone to record your loops. " +
            "Nothing is uploaded — recordings never leave this device. " +
            "Allow microphone access in your browser, then tap a pad to try again.");
    return false;
  }
}

function fmtTime(sec){
  return sec.toFixed(1) + "s";
}

/* A pad is a small state machine:
   empty -> recording -> (decode) -> playing <-> ready; hold -> empty.    */
class Pad {
  constructor(index){
    this.index = index;
    this.buffer = null;       // AudioBuffer once recorded
    this.source = null;       // AudioBufferSourceNode while playing
    this.recorder = null;     // MediaRecorder while recording
    this.chunks = [];
    this.recStartedAt = 0;
    this.timerId = null;
    this.pressTimer = null;
    this.longPressed = false;
    this.state = "empty";     // empty | recording | playing | ready

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pad empty";
    btn.style.setProperty("--hue", HUES[index]);
    btn.setAttribute("aria-label", "Loop pad " + (index + 1));
    btn.innerHTML =
      '<span class="num">' + (index + 1) + '</span>' +
      '<span class="state">Tap to record</span>' +
      '<span class="sub"></span>';
    this.el = btn;
    this.stateEl = btn.querySelector(".state");
    this.subEl = btn.querySelector(".sub");

    btn.addEventListener("pointerdown", (e) => this.onPressStart(e));
    btn.addEventListener("pointerup", () => this.onPressEnd());
    btn.addEventListener("pointercancel", () => this.onPressCancel());
    btn.addEventListener("pointerleave", () => this.onPressCancel());
    btn.addEventListener("contextmenu", (e) => e.preventDefault());
    board.appendChild(btn);
  }

  onPressStart(e){
    e.preventDefault();
    this.longPressed = false;
    this.pressTimer = setTimeout(() => {
      this.longPressed = true;
      this.clear();
    }, LONG_PRESS_MS);
  }

  onPressEnd(){
    if (this.pressTimer){ clearTimeout(this.pressTimer); this.pressTimer = null; }
    if (this.longPressed){ this.longPressed = false; return; }
    this.tap();
  }

  onPressCancel(){
    if (this.pressTimer){ clearTimeout(this.pressTimer); this.pressTimer = null; }
  }

  async tap(){
    ensureCtx();
    if (this.state === "empty") this.startRecording();
    else if (this.state === "recording") this.stopRecording();
    else if (this.state === "playing") this.stopPlayback();
    else if (this.state === "ready") this.startPlayback();
  }

  async startRecording(){
    if (!(await ensureMic())) { this.render(); return; }
    ensureCtx();
    this.chunks = [];
    try {
      this.recorder = new MediaRecorder(micStream);
    } catch (err) {
      showMsg("Sorry — this browser could not start recording.");
      return;
    }
    this.recorder.ondataavailable = (e) => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.recorder.onstop = () => this.finishRecording();
    this.recorder.start();
    this.recStartedAt = performance.now();
    this.state = "recording";
    this.timerId = setInterval(() => this.render(), 100);
    this.render();
  }

  stopRecording(){
    if (this.recorder && this.recorder.state !== "inactive") this.recorder.stop();
  }

  async finishRecording(){
    if (this.timerId){ clearInterval(this.timerId); this.timerId = null; }
    const type = (this.recorder && this.recorder.mimeType) || "audio/webm";
    const blob = new Blob(this.chunks, { type });
    this.chunks = [];
    try {
      const raw = await blob.arrayBuffer();
      this.buffer = await ensureCtx().decodeAudioData(raw);
    } catch (err) {
      this.buffer = null;
      this.state = "empty";
      showMsg("That take could not be read back — tap the pad to try again.");
      this.render();
      return;
    }
    /* Paul's rule: the second tap stops the take and the loop starts
       playing automatically. */
    this.startPlayback();
  }

  startPlayback(){
    if (!this.buffer) { this.state = "empty"; this.render(); return; }
    ensureCtx();
    this.stopSource();
    const src = audioCtx.createBufferSource();
    src.buffer = this.buffer;
    src.loop = true;               // gapless, sample-accurate restart
    src.connect(audioCtx.destination);
    src.start();
    this.source = src;
    this.state = "playing";
    this.el.style.setProperty("--loopdur", this.buffer.duration.toFixed(3) + "s");
    this.render();
  }

  stopSource(){
    if (this.source){
      try { this.source.onended = null; this.source.stop(); } catch (e) {}
      try { this.source.disconnect(); } catch (e) {}
      this.source = null;
    }
  }

  stopPlayback(){
    this.stopSource();
    this.state = this.buffer ? "ready" : "empty";
    this.render();
  }

  clear(){
    if (this.state === "recording"){
      if (this.timerId){ clearInterval(this.timerId); this.timerId = null; }
      if (this.recorder){
        this.recorder.onstop = null;
        if (this.recorder.state !== "inactive") { try { this.recorder.stop(); } catch (e) {} }
        this.recorder = null;
      }
      this.chunks = [];
    }
    this.stopSource();
    this.buffer = null;
    this.state = "empty";
    this.el.style.removeProperty("--loopdur");
    this.render();
  }

  render(){
    const el = this.el;
    el.classList.remove("empty", "recording", "playing", "ready");
    el.classList.add(this.state);
    if (this.state === "empty"){
      this.stateEl.textContent = "Tap to record";
      this.subEl.textContent = "";
    } else if (this.state === "recording"){
      const elapsed = (performance.now() - this.recStartedAt) / 1000;
      this.stateEl.textContent = "● Recording";
      this.subEl.textContent = fmtTime(elapsed) + " — tap to loop it";
    } else if (this.state === "playing"){
      this.stateEl.textContent = "▶ Looping";
      this.subEl.textContent = fmtTime(this.buffer.duration) + " — tap to stop · hold to clear";
    } else if (this.state === "ready"){
      this.stateEl.textContent = "❚❚ Loop ready";
      this.subEl.textContent = fmtTime(this.buffer.duration) + " — tap to play · hold to clear";
    }
  }
}

const pads = [];
for (let i = 0; i < 6; i++) pads.push(new Pad(i));

stopAllBtn.addEventListener("click", () => {
  pads.forEach((p) => { if (p.state === "playing") p.stopPlayback(); });
});

/* iOS/desktop: keep the context warm on any first touch. */
document.addEventListener("pointerdown", () => { if (audioCtx) ensureCtx(); }, { passive: true });
</script>
</body>
</html>
